<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب خدمة الإنترنت الضوئي FTTH</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS (Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        #map { height: 260px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl shadow">
                    <i class="fa-solid font-bold fa-network-wired text-xl text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg md:text-xl leading-tight">خدمة الإنترنت الضوئي (FTTH)</h1>
                    <p class="text-xs text-indigo-200">بوابة تقديم الطلبات والاستعلام</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Tab Navigation -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-6 max-w-md mx-auto shadow-inner">
            <button onclick="switchTab('new-request')" id="tab-new" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 bg-white text-indigo-900 shadow">
                <i class="fa-solid fa-paper-plane ml-1.5"></i> طلب جديد
            </button>
            <button onclick="switchTab('track-request')" id="tab-track" class="flex-1 py-2.5 rounded-lg font-bold text-sm transition-all duration-200 text-slate-600 hover:text-indigo-900">
                <i class="fa-solid fa-magnifying-glass ml-1.5"></i> تتبع طلبك
            </button>
        </div>

        <!-- Section: New Request Form -->
        <div id="section-new-request" class="space-y-6">
            
            <!-- Progress Stepper -->
            <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="grid grid-cols-3 gap-2 text-center relative">
                    <div class="space-y-2">
                        <div class="w-10 h-10 mx-auto rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold shadow-md shadow-indigo-100">1</div>
                        <p class="text-xs font-bold text-indigo-900">تقديم الطلب</p>
                    </div>
                    <div class="space-y-2">
                        <div class="w-10 h-10 mx-auto rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold">2</div>
                        <p class="text-xs font-semibold text-slate-400">الكشف الفني</p>
                    </div>
                    <div class="space-y-2">
                        <div class="w-10 h-10 mx-auto rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold">3</div>
                        <p class="text-xs font-semibold text-slate-400">التوصيل والتفعيل</p>
                    </div>
                </div>
            </div>

            <form id="ftth-form" onsubmit="handleFormSubmit(event)" class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100 space-y-6">
                
                <h2 class="text-lg font-bold text-slate-800 border-b pb-3 border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-indigo-600"></i> البيانات الأساسية للمشترك
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Full Name -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">الاسم الثلاثي <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" id="fullName" required placeholder="مثال: مهدي ظافر كمر" 
                                   class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm">
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">رقم الهاتف <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
                                <i class="fa-solid fa-phone">

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب خدمة الإنترنت الضوئي FTTH</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS & JS (Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        #map { height: 260px; width: 100%; border-radius: 0.75rem; z-index: 10; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Professional Header -->
    <header class="bg-gradient-to-r from-indigo-900 to-slate-900 text-white shadow-md sticky top-0 z-50 border-b border-indigo-800">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-indigo-600 p-2 rounded-lg shadow-inner">
                    <i class="fa-solid fa-network-wired text-base text-white"></i>
                </div>
                <h1 class="font-extrabold text-sm sm:text-base tracking-wide whitespace-nowrap">طلب خدمة الإنترنت الضوئي FTTH</h1>
            </div>
            <div class="text-xs text-indigo-300 font-semibold hidden sm:block whitespace-nowrap">بوابة المشتركين</div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">
        
        <!-- Tab Navigation -->
        <div class="flex bg-slate-200 p-1 rounded-xl mb-6 max-w-sm mx-auto shadow-inner">
            <button onclick="switchTab('new-request')" id="tab-new" class="flex-1 py-2 rounded-lg font-bold text-xs sm:text-sm transition bg-white text-indigo-900 shadow">
                <i class="fa-solid fa-paper-plane ml-1"></i> طلب جديد
            </button>
            <button onclick="switchTab('track-request')" id="tab-track" class="flex-1 py-2 rounded-lg font-bold text-xs sm:text-sm transition text-slate-600 hover:text-indigo-900">
                <i class="fa-solid fa-magnifying-glass ml-1"></i> تتبع طلبك
            </button>
        </div>

        <!-- Section: New Request Form -->
        <div id="section-new-request" class="space-y-6">
            
            <!-- Progress Stepper -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <div class="grid grid-cols-3 gap-2 text-center relative">
                    <div class="space-y-1">
                        <div class="w-8 h-8 mx-auto rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow">1</div>
                        <p class="text-[11px] font-bold text-indigo-900 whitespace-nowrap">التقديم</p>
                    </div>
                    <div class="space-y-1">
                        <div class="w-8 h-8 mx-auto rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-xs">2</div>
                        <p class="text-[11px] font-semibold text-slate-400 whitespace-nowrap">الكشف الفني</p>
                    </div>
                    <div class="space-y-1">
                        <div class="w-8 h-8 mx-auto rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-xs">3</div>
                        <p class="text-[11px] font-semibold text-slate-400 whitespace-nowrap">التوصيل والتفعيل</p>
                    </div>
                </div>
            </div>

            <form id="ftth-form" onsubmit="handleFormSubmit(event)" class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-slate-100 space-y-5">
                
                <h2 class="text-sm font-bold text-slate-800 border-b pb-2.5 border-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-indigo-600"></i> بيانات المشترك الأساسية
                </h2>

                <div class="grid grid-cols-1 md
